name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --project backend --locked --all-packages
      - run: uv run --project backend --locked ruff check backend
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: node scripts/test-e2e.mjs --backend
