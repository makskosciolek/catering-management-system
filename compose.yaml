name: cateringhub
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cateringhub_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/setup.ps1 first}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Missing orders password}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Missing inventory password}
      FULFILLMENT_DB_PASSWORD: ${FULFILLMENT_DB_PASSWORD:?Missing fulfillment password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cateringhub_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: ${RABBITMQ_NODE_HOSTNAME:-rabbitmq}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cateringhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/setup.ps1 first}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-cateringhub}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  rabbitmq_data:
