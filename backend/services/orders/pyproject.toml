[project]
name = "cateringhub-orders"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cateringhub-core",
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular[sidecar]>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23",
  "pika>=1.3,<2",
]

[tool.uv.sources]
cateringhub-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cateringhub_orders.settings"
testpaths = ["tests"]
addopts = "-q"
