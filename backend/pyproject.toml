[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.9"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
